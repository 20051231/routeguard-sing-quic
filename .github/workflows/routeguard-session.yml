name: RouteGuard Hysteria session hooks
on:
  push:
    branches: [codex/routeguard-warm-standby]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-tests:
    if: github.repository == '20051231/routeguard-sing-quic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - run: go test -race ./hysteria2 -count=1
